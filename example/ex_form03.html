<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 전체 기본 스타일 */
    body {
      font-family: sans-serif;
      font-size: 14px;
    }

    h3 {
      margin-bottom: 20px;
    }

    /* ul 기본 여백 및 기호(점) 제거 */
    ul {
      list-style-type: none;
      padding-left: 0;
      margin: 0;
    }

    /* 행 간격 설정 */
    li {
      margin-bottom: 15px;
    }

    /* 라벨 스타일 지정 */
    label {
      font-weight: bold;
    }

    /* textarea 스타일 지정 */
    textarea {
      width: 320px;
      height: 80px;
      margin-top: 5px;
    }

    /* 버튼 여백 지정 */
    button, input[type="submit"], input[type="reset"] {
      padding: 3px 8px;
    }
  </style>
</head>
<body>
  <h3>회원 설문</h3>

  <!-- 조건 ①: HTML 온라인 서식 작성 -->
  <form action="#" method="post">
    <ul>

      <!-- 1. 이메일 주소: type="email" (조건 ②) -->
      <li>
        <label for="user-email">이메일 주소:</label>
        <input type="email" id="user-email" name="user-email" placeholder="id@host">
      </li>

      <!-- 2. 홈페이지: type="url" (조건 ②) -->
      <li>
        <label for="homepage">홈페이지:</label>
        <input type="url" id="homepage" name="homepage" placeholder="https://">
      </li>

      <!-- 3. 좋아하는 음료: type="search" (조건 ②) -->
      <li>
        <label for="drink">좋아하는 음료:</label>
        <input type="search" id="drink" name="drink" placeholder="음료를 입력하세요">
      </li>

      <!-- 4. 성별 선택: type="radio" -->
      <li>
        <label>성별 선택:</label>
        <label><input type="radio" name="gender" value="남성"> 남성</label>
        <label><input type="radio" name="gender" value="여성"> 여성</label>
      </li>

      <!-- 5. 취미(복수 선택 가능): type="checkbox" -->
      <li>
        <label>취미(복수 선택 가능):</label>
        <label><input type="checkbox" name="hobby" value="독서"> 독서</label>
        <label><input type="checkbox" name="hobby" value="음악"> 음악</label>
        <label><input type="checkbox" name="hobby" value="여행"> 여행</label>
      </li>

      <!-- 6. 추가 의견: <textarea> -->
      <li>
        <label for="opinion">추가 의견:</label><br>
        <textarea id="opinion" name="opinion" placeholder="자유롭게 입력하세요"></textarea>
      </li>

      <!-- 7. 제출 및 리셋 버튼 -->
      <li>
        <input type="submit" value="제출">
        <input type="reset" value="리셋">
      </li>

    </ul>
  </form>
</body>
</html>
