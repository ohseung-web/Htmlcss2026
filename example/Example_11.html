<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Example_11</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        width: 600px;
        margin: 0 auto;
        text-align: center;
      }

      img {
        width: 100%;
        display: block;
      }

      h1 {
        background-color: black;
        color: white;
        padding: 15px;
        margin: 0;
        border-radius: 15px;
        box-shadow: 8px 8px 10px gray;
        font-size: 28px;
      }

      ul {
        list-style: none;
        text-align: left;
        padding: 0 10px;
      }

      li {
        margin-bottom: 12px;
        line-height: 1.5;
      }

      span {
        color: blue;
        text-decoration: underline;
        font-weight: bold;
      }
      img {
        width: 100px;
        height: 100px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <img src="/images/coffee.jpg" alt="coffee beans" />

    <h1>Best Coffee Beans of the World</h1>

    <ul>
      <li>
        <span>Ethiopia Yirgacheffe</span> : Known for its bright acidity and
        floral, citrus notes.
      </li>
      <li>
        <span>Colombia Supremo</span> : Balanced flavor with a nutty, caramel
        sweetness.
      </li>
      <li>
        <span>Guatemala Antigua</span> : Rich body with smoky, chocolate
        undertones.
      </li>
    </ul>
  </body>
</html>
