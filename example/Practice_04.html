<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Practice_09</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: 'Malgun Gothic', sans-serif;
        background: #fff;
        padding: 20px;
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-width: 300px;
      }

      .item {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      /* 썸네일을 감싸는 박스 : 랭킹 배지를 올리기 위한 기준(relative) */
      .thumb {
        position: relative;
        width: 70px;
        height: 70px;
        border-radius: 10px;
        overflow: hidden;
        flex-shrink: 0;
      }

      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* 순위 배지는 썸네일 좌상단 모서리에 absolute + z-index로 겹치기 */
      .rank {
        position: absolute;
        top: -8px;
        left: -8px;
        z-index: 10;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: gray;
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* 1위는 금색으로 별도 강조 */
      .rank.gold {
        background: gold;
        color: #3a2a00;
      }

      .kw {
        font-weight: 600;
        font-size: 13.5px;
        color: #222;
      }
      .trend {
        font-size: 11px;
        color: #ff3b30;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div class="list">
      <div class="item">
        <div class="thumb">
          <img src="https://picsum.photos/id/201/120/120" alt="무선 이어폰" />
          <span class="rank gold">1</span>
        </div>
        <div>
          <div class="kw">무선 이어폰</div>
          <div class="trend">▲ 상승</div>
        </div>
      </div>

      <div class="item">
        <div class="thumb">
          <img
            src="https://picsum.photos/id/342/120/120"
            alt="블루투스 스피커"
          />
          <span class="rank">2</span>
        </div>
        <div>
          <div class="kw">블루투스 스피커</div>
        </div>
      </div>

      <div class="item">
        <div class="thumb">
          <img src="https://picsum.photos/id/425/120/120" alt="보조배터리" />
          <span class="rank">3</span>
        </div>
        <div>
          <div class="kw">보조배터리</div>
        </div>
      </div>
    </div>
  </body>
</html>
