<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Exflex01</title>
    <style>
      /* 기본 리스트 스타일(점, 여백) 제거 */
      ul.nav {
        list-style: none;
        padding: 0;
        margin: 0;

        /* 조건 3: flex 속성을 이용해 가로 정렬 및 우측 배치 */
        display: flex;
        justify-content: center; /* 오른쪽으로 정렬 */
        background-color: #f2f2f2; /* 배경 회색 */
        padding: 10px 0;
      }

      ul.nav li {
        margin-right: 20px; /* 메뉴 간격 조정 */
      }

      /* 링크 밑줄 제거 및 글자색 지정 */
      ul.nav li a {
        text-decoration: none;
        color: #333;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <ul class="nav">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </body>
</html>
