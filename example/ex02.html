<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ex02 - 인용문 및 첨자 표기</title>
  </head>
  <body>
    <h1>인용문 및 첨자/수정 태그 활용</h1>

    <!-- 인용문 구역 -->
    <blockquote>
      웹의 힘은 그것의 보편성에 있다. 장애에 상관없이 모든 사람이 접근할 수 있는
      것이 필수적인 요소이다.
    </blockquote>

    <!-- 수식 및 화학식 표기 -->
    <p>
      피타고라스 정리는 x<sup>2</sup> + y<sup>2</sup> = z<sup>2</sup> 공식으로
      표현됩니다.<br />
      물 분자 기호는 H<sub>2</sub>O 입니다.
    </p>

    <!-- 삭제 및 추가 표기 -->
    <p>
      이벤트 기간: <del>2026년 8월 31일</del> &rarr;
      <ins>2026년 9월 15일까지 연장</ins>
    </p>
  </body>
</html>
