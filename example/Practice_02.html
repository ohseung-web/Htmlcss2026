<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Practice_07</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: 'Malgun Gothic', sans-serif;
        background: #fff;
        padding: 20px;
      }

      /* float로 배치된 아이템들을 감싸는 리스트 : 클리어픽스 처리 */
      /* .list::after {
        content: '';
        display: block;
        clear: both;
      } */

      .item {
        /* float: left; */
        display: inline-block;
        width: 104px;
        margin-right: 16px;
        margin-bottom: 16px;
        text-align: center;
        font-size: 12px;
      }

      /* 이미지를 감싸는 박스 : 오버레이를 올리기 
      위한 기준(relative) */
      .thumb {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 10px;
        overflow: hidden;
        margin: 0 auto 6px;
      }

      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* 품절 상품 이미지는 흑백 처리 */
      .thumb.soldout img {
        filter: grayscale(90%);
      }

      /* 오버레이는 이미지 전체를 덮도록 
      absolute + top/left/right/bottom:0 */
      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 1px;
        /* 텍스트를 박스 중앙에 놓기 위해 line-height로 세로 정렬 */
        line-height: 96px;
        text-align: center;
      }

      .name {
        color: #666;
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <div class="list">
      <div class="item">
        <div class="thumb">
          <img src="https://picsum.photos/id/103/200/200" alt="런닝화 A" />
        </div>
        <div class="name">런닝화 A</div>
      </div>

      <div class="item">
        <div class="thumb soldout">
          <img src="https://picsum.photos/id/21/200/200" alt="런닝화 B" />
          <div class="overlay">SOLD OUT</div>
        </div>
        <div class="name">런닝화 B</div>
      </div>

      <div class="item">
        <div class="thumb">
          <img src="https://picsum.photos/id/26/200/200" alt="런닝화 C" />
        </div>
        <div class="name">런닝화 C</div>
      </div>

      <div class="item">
        <div class="thumb soldout">
          <img src="https://picsum.photos/id/28/200/200" alt="런닝화 D" />
          <div class="overlay">SOLD OUT</div>
        </div>
        <div class="name">런닝화 D</div>
      </div>
    </div>
  </body>
</html>
