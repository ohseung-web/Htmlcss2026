<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Exflex02</title>
    <style>
      /* 부모 컨테이너: 카드들을 가로 배치하고 간격을 조절 */
      .card-container {
        display: flex;
        gap: 15px; /* 카드 사이 간격 */
      }

      /* 카드 스타일 */
      .card {
        flex: 1; /* 카드들이 동일한 비율로 공간을 나누어 가짐 */
        background-color: #2196f3; /* 파란색 배경 */
        color: white; /* 흰색 글자 */
        padding: 20px;
        border-radius: 8px; /* 둥근 모서리 */
        text-align: center; /* 텍스트 가운데 정렬 */
      }

      /* 카드 내부 제목 margin 조절 */
      .card h3 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 16px;
      }

      /* 카드 내부 본문 글자 크기 */
      .card p {
        margin: 0;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card-container">
      <div class="card">
        <h3>Card 1</h3>
        <p>첫 번째 카드 설명입니다.</p>
      </div>
      <div class="card">
        <h3>Card 2</h3>
        <p>두 번째 카드 설명입니다.</p>
      </div>
      <div class="card">
        <h3>Card 3</h3>
        <p>세 번째 카드 설명입니다.</p>
      </div>
    </div>
  </body>
</html>
