<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>form </title>
  <style>
    /* 전체 글꼴 설정 */
    body {
      font-family: sans-serif;
      font-size: 14px;
    }

    h3 {
      margin-bottom: 20px;
    }

    /* ul 기본 여백 및 기호(점) 제거 */
    ul {
      list-style-type: none;
      padding-left: 0;
      margin: 0;
    }

    /* li 행 간격 설정 */
    li {
      margin-bottom: 12px;
    }

    /* 라벨 굵기 지정 */
    label {
      font-weight: bold;
    }

    /* 텍스트 상자 영역 크기 지정 */
    textarea {
      width: 300px;
      height: 80px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h3>간단한 설문</h3>

  <!-- 조건 ②: <form> 태그 작성 -->
  <form action="#" method="post">
    <ul>

      <!-- 1. 좋아하는 과일 선택: <select> 활용 (조건 ③: 사과, 바나나, 딸기, 포도) -->
      <li>
        <label for="fruit">좋아하는 과일 선택:</label>
        <select id="fruit" name="fruit">
          <option value="사과">사과</option>
          <option value="바나나">바나나</option>
          <option value="딸기">딸기</option>
          <option value="포도">포도</option>
        </select>
      </li>

      <!-- 2. 좋아하는 음료 입력: <input list="..."> 및 <datalist> 활용 (조건 ④: 콜라, 사이다, 주스, 커피) -->
      <li>
        <label for="drink">좋아하는 음료 입력:</label>
        <input type="text" id="drink" name="drink" list="drink-list">
        <datalist id="drink-list">
          <option value="콜라"></option>
          <option value="사이다"></option>
          <option value="주스"></option>
          <option value="커피"></option>
        </datalist>
      </li>

      <!-- 3. 취미(복수 선택 가능): checkbox -->
      <li>
        <label>취미(복수 선택 가능):</label>
        <label><input type="checkbox" name="hobby" value="독서"> 독서</label>
        <label><input type="checkbox" name="hobby" value="운동"> 운동</label>
        <label><input type="checkbox" name="hobby" value="음악"> 음악</label>
        <label><input type="checkbox" name="hobby" value="여행"> 여행</label>
      </li>

      <!-- 4. 성별 선택: radio -->
      <li>
        <label>성별 선택:</label>
        <label><input type="radio" name="gender" value="남성"> 남성</label>
        <label><input type="radio" name="gender" value="여성"> 여성</label>
      </li>

      <!-- 5. 추가 의견: <textarea> -->
      <li>
        <label for="opinion">추가 의견:</label><br>
        <textarea id="opinion" name="opinion" placeholder="의견을 입력하세요"></textarea>
      </li>

    </ul>
  </form>
</body>
</html>
