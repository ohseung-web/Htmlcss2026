<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Practice_08</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: 'Malgun Gothic', sans-serif;
        background: #fff;
        padding: 20px;
      }

      .row {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
      }

      .user {
        width: 90px;
        text-align: center;
        font-size: 12px;
      }

      /* 프로필 사진을 감싸는 원형 박스 : 배지를 올리기 위한 기준(relative) */
      .avatar {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        overflow: hidden;
        margin: 0 auto 6px;
        border: 2px solid #eee;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* 인증 배지는 아바타 우측 하단 모서리에 absolute + z-index로 겹치기 */
      .verify {
        position: absolute;
        bottom: -2px;
        right: -2px;
        z-index: 5;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: dodgerblue;
        border: 2px solid #fff;
        color: #fff;
        font-size: 11px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .name {
        font-weight: 600;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="user">
        <div class="avatar">
          <img src="https://picsum.photos/id/64/100/100" alt="공식스토어" />
          <span class="verify">✓</span>
        </div>
        <div class="name">공식스토어</div>
      </div>

      <div class="user">
        <div class="avatar">
          <img src="https://picsum.photos/id/65/100/100" alt="일반회원" />
        </div>
        <div class="name">일반회원</div>
      </div>

      <div class="user">
        <div class="avatar">
          <img src="https://picsum.photos/id/91/100/100" alt="브랜드관" />
          <span class="verify">✓</span>
        </div>
        <div class="name">브랜드관</div>
      </div>
    </div>
  </body>
</html>
