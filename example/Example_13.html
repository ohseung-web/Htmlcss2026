<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Example_13</title>
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        justify-content: center;
        background-color: #fafafa;
    }

    .menu {
        width: 400px;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 12px;
        background-color: #f5ecd7;
    }

    h1 {
        text-align: center;
        letter-spacing: 4px;
        font-size: 24px;
        margin-bottom: 20px;
    }

    ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    li {
        display: flex;
        justify-content: space-between;
        text-transform: uppercase;
        padding: 8px 0;
        border-bottom: 1px dashed #999;
        font-size: 15px;
    }

    span {
        text-align: right;
    }
</style>
</head>
<body>

    <div class="menu">
        <h1>Café Menu</h1>
        <ul>
            <li>Americano <span>$3.50</span></li>
            <li>Latte <span>$4.00</span></li>
            <li>Cappuccino <span>$4.20</span></li>
        </ul>
    </div>

</body>
</html>
