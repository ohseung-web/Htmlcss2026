<!doctype html>
<html lang="kr">
  <head>
    <meta charset="UTF-8" />
    <title>네이버 로그인 스타일 실습</title>
    <link rel="stylesheet" href="/styleCSS/style_login.css" />
  </head>
  <body>
    <div class="login-wrap">
      <h1 class="logo">NAVER</h1>
      <div class="login-box">
        <div class="input-group">
          <input type="text" placeholder="아이디 또는 전화번호" />
        </div>
        <div class="input-group">
          <input type="password" placeholder="비밀번호" />
        </div>
        <div class="option-row">
          <label class="keep-login">
            <input type="checkbox" />
            로그인 상태 유지
          </label>
          <div class="ip-security">
            <span>IP 보안</span>
          </div>
        </div>
        <div class="btn-row">
          <button class="passkey-btn">&#128100; 패스키 로그인</button>
          <button class="login-btn">로그인</button>
        </div>
        <div class="sub-links">
          <a href="#">QR 코드 로그인</a>
          <span class="divider">|</span>
          <a href="#">일회용 번호 로그인</a>
        </div>
      </div>
    </div>
  </body>
</html>
