<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>표 연습문제</title>
    <style>
      /* 표 기본 스타일 설정 */
      table {
        width: 700px;
        border-collapse: collapse;
        text-align: center;
      }

      /* 표의 border색 : #ddd */
      th,
      td {
        border: 1px solid #ddd;
        padding: 10px;
      }

      /* 표의 머리말 배경색 : #ea6153, 표 전체의 글꼴 색 : #fff (머리말 글자색 적용) */
      thead th {
        background-color: #ea6153;
        color: #fff;
        font-weight: bold;
      }

      /* 본문 데이터 글자 색상 및 스타일 */
      tbody td {
        color: #333;
      }

      /* tbody tr td:first-child {
        font-weight: bold;
      } */

      /* 표의 요약 배경색 : #333, 글자색 : #fff */
      tfoot td {
        background-color: #333;
        color: #fff;
        font-weight: bold;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <table>
      <!-- 머리말 영역 (thead) -->
      <thead>
        <tr>
          <th>방이름</th>
          <th>대상</th>
          <th>인실</th>
          <th>가격</th>
        </tr>
      </thead>

      <!-- 요약 영역 (tfoot: HTML 표준 규칙에 따라 tbody 앞에 작성하거나 뒤에 작성 모두 가능) -->
      <tfoot>
        <tr>
          <td colspan="4">
            모든 준비 재료가 포함된 바베큐장을 렌트해드립니다.(가격:<del
              >150,000</del
            >
            &rarr; 100,000원/4인기준)
          </td>
        </tr>
      </tfoot>

      <!-- 본문 영역 (tbody) -->
      <tbody>
        <tr>
          <td>유채방</td>
          <td>여성전용</td>
          <td rowspan="3">4인실</td>
          <td rowspan="3">1팀 30,000원</td>
        </tr>
        <tr>
          <td>동백방</td>
          <td>남성전용</td>
        </tr>
        <tr>
          <td>백합방</td>
          <td>커플전용</td>
        </tr>
        <tr>
          <td>튤립방</td>
          <td>가족전용</td>
          <td>4인실</td>
          <td>100,000원(4인기준 1팀당)</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
