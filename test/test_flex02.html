<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flex 연습</title>
    <style>
      .container {
        /* display: inline-flex; */
        display: flex;
        flex-direction: row;
        /* flex-direction: column-reverse; */
        /* height: 900px; */
        /* item 줄바꿈 */
        flex-wrap: wrap; /* 줄바꿈 */
        flex-wrap: nowrap; /* 줄바꿈 안함(기본값) */
        width: 500px;
      }
      .container .box {
        width: 100px;
        height: 100px;
        /* border: 1px solid red; */
        background-color: crimson;
        border-radius: 5px;
        margin: 5px;
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- 
      기본적으로 Items는 한 줄에서만 표시되고 줄 바꿈 되지 않는다.
      이는 지정된 크기(주 축에 따라 width나 height)를 무시하고 한 줄 안에서만 가변 한다.
      Items를 줄 바꿈 하려면 값으로 wrap을 사용해야 한다. 
    -->
    <div class="container">
      <div class="box">box1</div>
      <div class="box">box2</div>
      <div class="box">box1</div>
      <div class="box">box2</div>
      <div class="box">box3</div>
      <div class="box">box3</div>
      <div class="box">box2</div>
      <div class="box">box3</div>
      <div class="box">box3</div>
    </div>

    <br />
  </body>
</html>
