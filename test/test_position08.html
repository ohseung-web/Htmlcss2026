<!doctype html>
<html lang="kr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>position & z-index</title>
    <style>
      /* 
        [z-index 핵심 규칙]
        1. z-index는 반드시 position 속성(relative, absolute, fixed 등)과 함께 사용해야 함.
        2. 숫자가 클수록 위로 올라옴 (마이너스 값도 가능).
        3. z-index가 없거나 같으면 HTML 구조상 나중에 작성된 요소가 위로 올라옴.
      */

      .parent div {
        width: 200px;
        height: 200px;
        position: absolute; /* z-index 작동을 위해 포지션 지정 필수 */
      }

      /* 1번 박스 (하늘색) */
      .child {
        background-color: skyblue;
        margin: 10px;
        z-index: 0; /* 가장 낮은 레이어 순서 */
      }

      /* 2번 박스 (금색) */
      .child2 {
        background-color: gold;
        margin: 30px;
        z-index: 2; /* 가장 높은 숫수이므로 맨 위로 올라옴 */
      }

      /* 3번 박스 (회색) */
      .child3 {
        background-color: gray;
        margin: 20px;
        z-index: 1; /* skyblue(0)보다 높고 gold(2)보다 낮아 중간에 위치 */
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="child"></div>
      <div class="child2"></div>
      <div class="child3"></div>
    </div>
  </body>
</html>
