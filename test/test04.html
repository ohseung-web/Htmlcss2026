<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>표</title>
    <style>
      table {
        /* 셀 사이의 간격을 없애고 테두리를 합칩니다 */
        border-collapse: collapse;
        width: 500px;
        text-align: center;
      }
      th,
      td {
        border: 1px solid #333; /* 기본 테두리 설정 */
        padding: 8px;
      }
      th {
        background-color: lightgray;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <th style="border-left: 0">번호</th>
        <th>시설명</th>
        <th style="border-right: none">시설분류</th>
      </tr>
      <tr>
        <td colspan="2" style="border-left: none">-</td>
        <td rowspan="2" style="border-right: none">-</td>
      </tr>
      <tr>
        <td rowspan="2" style="border-left: none">-</td>
        <td>-</td>
      </tr>
      <tr>
        <td colspan="2" style="border-right: none">-</td>
      </tr>
    </table>
  </body>
</html>
