<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flex 연습</title>
    <style>
      .container {
        /* display: inline-flex; */
        display: flex;
      }
      .container .box {
        width: 100px;
        height: 100px;
        border: 1px solid red;
      }
    </style>
  </head>
  <body>
    <!-- display: flex를 지정하면 대상 요소가 Flex 컨테이너가 되면서, 그 내부의 직계 자식 요소들(Flex Item)은 자동으로 블록 수준(Block-level) 요소와 유사한 성격을 갖게 됩니다.

      따라서 기본적으로 너비(width)와 높이(height)를 가질 수 없는 Inline 요소인 <span> 태그라도, Flex 컨테이너의 자식(Flex Item)이 되는 순간 너비와 높이 값이 정상 적용됩니다.

      Flex 레이아웃 작동 시 나타나는 특징입니다.

      인라인 요소의 변화: <span>, <a> 등의 인라인 요소도 Flex Item이 되면 display: block처럼 width, height, margin (상하 포함) 등이 모두 적용됩니다.

      컨테이너 자체의 동작: 주석 처리되어 있는 display: inline-flex를 사용하더라도 자식 요소들은 똑같이 Flex Item이 되어 너비와 높이를 가질 수 있습니다. (flex와 inline-flex의 차이는 자식 요소가 아니라 컨테이너 자체가 주변과 배치되는 방식의 차이입니다.)

      오타 참고: 코드 내 클래스명 contianer는 container의 오타로 보이지만, CSS 선택자와 HTML 클래스명이 일치하기 때문에 스타일은 문제없이 잘 작동합니다. -->
    <div class="container">
      <div class="box">box1</div>
      <div class="box">box2</div>
      <div class="box">box3</div>
    </div>
    <div class="container">
      <div class="box">box1</div>
      <div class="box">box2</div>
      <div class="box">box3</div>
    </div>
    <br />
    <span class="container">
      <span class="box">span1</span>
      <span class="box">span2</span>
      <span class="box">span3</span>
    </span>
    <span class="container">
      <span class="box">span1</span>
      <span class="box">span2</span>
      <span class="box">span3</span>
    </span>
  </body>
</html>
