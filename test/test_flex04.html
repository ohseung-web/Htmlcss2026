<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flex 연습</title>
    <style>
      .container {
        /* display: inline-flex; */
        display: flex;
        width: 700px;
        border: 2px solid green;
        margin: 0 auto;
        flex-wrap: wrap;
        /* align-content : center해도 안먹히는 이유는
           높이 값이 없기때문이다.
        */
        align-content: space-evenly;
        justify-content: center;
        height: 500px;
      }
      .container .box {
        width: 100px;
        height: 100px;
        /* border: 1px solid red; */
        background-color: crimson;
        border-radius: 5px;
        margin: 5px;
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- 
        align-content는 아이템들이 줄바꿈되어 2줄 이상이 되었을 때,
        줄(Line) 단위로 교차 축(vertical) 정렬을 하는 속성입니다.
        align-items vs align-content

        align-items: 아이템들이 한 줄로 있을 때 각각의 높낮이를 정렬합니다.

        align-content: 아이템이 많아 2줄, 3줄로 줄바꿈(flex-wrap: wrap) 되었을 때, 
        그 줄 덩어리 전체를 위/아래/가운데로 정렬합니다.

        왜 1줄일 땐 안 먹힐까?
        줄이 1개뿐이라면 줄과 줄 사이의 여백이라는 개념 자체가 없기 때문에 
        align-content는 아무 동작도 하지 않습니다. 
        1줄일 땐 반드시 align-items를 써야 합니다.
    -->
    <div class="container">
      <div class="box">box1</div>
      <div class="box">box2</div>
      <div class="box">box3</div>
      <div class="box">box4</div>
      <div class="box">box5</div>
      <div class="box">box6</div>
      <div class="box">box4</div>
      <div class="box">box5</div>
      <div class="box">box6</div>
    </div>

    <br />
  </body>
</html>
