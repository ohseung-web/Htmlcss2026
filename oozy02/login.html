<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>로그인 - OOZY COFFEE</title>
    <link rel="stylesheet" href="login02.css" />
    <link rel="stylesheet" href="comm.css" />
  </head>
  <body>
    <main>
      <!-- section시멘틱 태그는  주제별 콘텐츠 영역  -->
      <section class="login-box">
        <h1 class="logo"><a href="index.html">OOZY COFFEE</a></h1>

        <!-- 로그인 폼 -->
        <form action="#" method="post">
          <!-- <label for="email" class="blind">이메일</label> -->
          <input
            type="email"
            id="email"
            placeholder="이메일을 입력해 주세요."
          />

          <!-- <label for="pw" class="blind">비밀번호</label> -->
          <input
            type="password"
            id="pw"
            placeholder="비밀번호를 입력해 주세요."
          />

          <button type="submit" class="btn-login">로그인</button>

          <div class="login-option">
            <label class="keep">
              <input type="checkbox" /> 로그인 상태 유지
            </label>
            <a href="#">아이디 · 비밀번호 찾기</a>
          </div>
        </form>

        <!-- SNS 간편 로그인 -->
        <section class="sns-login">
          <h2>SNS 간편 로그인</h2>
          <ul>
            <li>
              <a href="#" class="naver"
                ><img src="images/sns_naver.svg" alt="네이버 로그인"
              /></a>
            </li>
            <li>
              <a href="#" class="kakao"
                ><img src="images/sns_kakao.svg" alt="카카오 로그인"
              /></a>
            </li>
            <li>
              <a href="#" class="facebook"
                ><img src="images/sns_facebook.svg" alt="페이스북 로그인"
              /></a>
            </li>
            <li>
              <a href="#" class="google"
                ><img src="images/sns_google.svg" alt="구글 로그인"
              /></a>
            </li>
            <li>
              <a href="#" class="apple"
                ><img src="images/sns_apple.svg" alt="애플 로그인"
              /></a>
            </li>
          </ul>
        </section>

        <!-- 회원가입 -->
        <a href="#" class="btn-join">회원가입</a>
        <p class="join-msg">
          회원가입 하면 <strong>10만원 쿠폰팩</strong>을 드려요!
        </p>
      </section>
    </main>
  </body>
</html>
