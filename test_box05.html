<!doctype html>
<html lang="kr">
  <head>
    <meta charset="UTF-8" />
    <title>padding과 margin</title>
    <style>
      .box {
        width: 600px;
        border: 1px solid red;
      }

      .box div {
        border: 1px solid blue;
        width: 200px;
        height: 200px;
        float: left; /* 가로배치 */
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </body>
</html>
